<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <style>
    text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#17243a}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#64748b}.section{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#475569}.box{stroke-width:2;rx:14}.arrow{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
  </style>
</defs>
<rect width="1440" height="880" fill="#f5f7fb"/>
<text x="60" y="58" class="title">SiameseModel：关系预训练与少样本分类</text>
<text x="60" y="90" class="subtitle">共享 BaseModel 权重；先学习 A&gt;B 关系，再冻结骨干网络训练数字分类头</text>
<rect x="42" y="125" width="1356" height="410" rx="22" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
<text x="72" y="166" class="section">阶段一：关系预训练</text>
<rect x="85" y="220" width="190" height="78" class="box" fill="#eaf2ff" stroke="#8db5f4"/>
<text x="180" y="250" class="label" text-anchor="middle">图片 A</text><text x="180" y="276" class="small" text-anchor="middle">[B, 1, 28, 28]</text>
<rect x="85" y="365" width="190" height="78" class="box" fill="#eaf2ff" stroke="#8db5f4"/>
<text x="180" y="395" class="label" text-anchor="middle">图片 B</text><text x="180" y="421" class="small" text-anchor="middle">[B, 1, 28, 28]</text>
<rect x="390" y="263" width="250" height="138" class="box" fill="#e8f7f2" stroke="#63b99f"/>
<text x="515" y="307" class="label" text-anchor="middle">共享 BaseModel</text><text x="515" y="336" class="small" text-anchor="middle">同一组 CNN 权重</text><text x="515" y="362" class="small" text-anchor="middle">每张图 → 128D embedding</text>
<rect x="740" y="280" width="205" height="105" class="box" fill="#f0ebff" stroke="#a88be8"/>
<text x="842" y="318" class="label" text-anchor="middle">拼接 embedding</text><text x="842" y="348" class="small" text-anchor="middle">[e_A ; e_B] ∈ R²⁵⁶</text>
<rect x="1035" y="280" width="180" height="105" class="box" fill="#fff2df" stroke="#e6ad5c"/>
<text x="1125" y="317" class="label" text-anchor="middle">MLP 关系头</text><text x="1125" y="348" class="small" text-anchor="middle">256 → 64 → 1</text>
<rect x="1270" y="280" width="95" height="105" class="box" fill="#ffe8e8" stroke="#e78b8b"/>
<text x="1317" y="316" class="label" text-anchor="middle">P(A&gt;B)</text><text x="1317" y="348" class="small" text-anchor="middle">Sigmoid</text>
<path d="M275 259 C325 259 335 300 390 300" class="arrow"/><path d="M275 404 C325 404 335 363 390 363" class="arrow"/>
<path d="M640 300 C680 300 695 305 740 310" class="arrow"/><path d="M640 363 C680 363 695 355 740 355" class="arrow"/>
<path d="M945 332 L1035 332" class="arrow"/><path d="M1215 332 L1270 332" class="arrow"/>
<text x="1320" y="420" class="small" text-anchor="middle">BCE Loss</text><path d="M1317 385 L1317 400" class="arrow"/>
<rect x="65" y="465" width="1310" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="720" y="492" class="small" text-anchor="middle">用关系标签 y∈{0,1} 监督；按验证集关系准确率保存最佳关系模型</text>
<rect x="42" y="565" width="1356" height="270" rx="22" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
<text x="72" y="606" class="section">阶段二：少样本数字分类</text>
<rect x="95" y="665" width="225" height="94" class="box" fill="#eaf2ff" stroke="#8db5f4"/>
<text x="207" y="701" class="label" text-anchor="middle">每类 K 张标注图片</text><text x="207" y="731" class="small" text-anchor="middle">K=1 或 K=3，共 10K 张</text>
<rect x="445" y="665" width="265" height="94" class="box" fill="#e8f7f2" stroke="#63b99f"/>
<text x="577" y="701" class="label" text-anchor="middle">加载最佳关系 backbone</text><text x="577" y="731" class="small" text-anchor="middle">冻结参数，关闭 dropout</text>
<rect x="835" y="665" width="195" height="94" class="box" fill="#f0ebff" stroke="#a88be8"/>
<text x="932" y="701" class="label" text-anchor="middle">分类头</text><text x="932" y="731" class="small" text-anchor="middle">Linear(128 → 10)</text>
<rect x="1140" y="665" width="190" height="94" class="box" fill="#fff2df" stroke="#e6ad5c"/>
<text x="1235" y="701" class="label" text-anchor="middle">交叉熵训练</text><text x="1235" y="731" class="small" text-anchor="middle">输出数字类别 0–9</text>
<path d="M320 712 L445 712" class="arrow"/><path d="M710 712 L835 712" class="arrow"/><path d="M1030 712 L1140 712" class="arrow"/>
<path d="M575 665 C575 600 515 550 515 401" class="arrow dash"/>
<text x="605" y="635" class="small">从阶段一载入特征权重</text>
</svg>
